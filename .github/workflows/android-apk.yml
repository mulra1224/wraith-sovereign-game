name: Build verified Android debug APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate project
        run: python tests/validate_project.py

  android:
    needs: validate
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.3
      env:
        HOME: /root

    steps:
      - uses: actions/checkout@v4
      - name: Import project
        run: godot --headless --editor --quit-after 3
      - name: Export debug APK
        run: |
          mkdir -p build/android
          godot --headless --verbose --export-debug "Android" build/android/wraith-sovereign-debug.apk
      - name: Audit APK permissions, signature and integrity
        run: bash tests/apk_security_audit.sh build/android/wraith-sovereign-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: wraith-sovereign-android-debug
          path: |
            build/android/wraith-sovereign-debug.apk
            apk-signature.txt
            apk-sha256.txt
          if-no-files-found: error
